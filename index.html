<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="/apple-icon-180.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="description"
      content="Stream your favorite movies, TV shows, and live sports on Let's Stream. Enjoy personalized recommendations and a high-quality viewing experience."
    />
    <!-- Preconnect & DNS-prefetch for critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <!-- Add Playfair Display font for Hero component typography -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500;600;700&display=swap"
    />
    <!-- Google Cast SDK for Chromecast -->
    <script
      src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"
      async
    ></script>
    <title>Let's Stream - Watch Movies, TV Shows & Live Sports Online</title>
    <script>
      // URL and base path for easier debugging in console
      window.appBaseUrl = window.location.origin;
      // BASE_URL is injected at build time by Vite
      window.appBasePath = "/";
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #09090b;
        color: #a1a1aa;
      }
      #root > noscript {
        display: block;
        padding: 24px;
      }
      .boot-screen {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #09090b;
        color: #a1a1aa;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        font-size: 14px;
        font-weight: 500;
      }
      .boot-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #e63462;
        border-radius: 9999px;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced as soon as React mounts. Without it the first paint on a slow
           connection was an empty dark screen with no sign anything was loading. -->
      <div class="boot-screen">
        <div class="boot-spinner" aria-hidden="true"></div>
        <p>Loading Let's Stream</p>
      </div>
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- Service worker registration happens in src/utils/register-sw.ts -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
